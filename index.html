<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Aika — Music Generation Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07100c;--g:rgba(255,255,255,.045);--ln:rgba(190,230,170,.15);--tx:#e8f0e6;--mu:#8fa392;--ac:#a6d98f;
--btn:linear-gradient(180deg,#c4e6ad,#8cc27a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);background:var(--bg);font:400 15px/1.45 Manrope,system-ui,sans-serif}
body{min-height:100vh;padding:14px 14px calc(104px + env(safe-area-inset-bottom,0px));
background:radial-gradient(600px 380px at 15% 0,rgba(70,110,60,.35),transparent 70%),radial-gradient(500px 420px at 100% 55%,rgba(40,80,50,.3),transparent 70%),
radial-gradient(500px 300px at 0 100%,rgba(60,90,40,.3),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;left:50%;top:-30vw;width:150vw;height:150vw;transform:translateX(-50%);border-radius:50%;border:1px solid var(--ln);pointer-events:none}
.hide{display:none!important}
svg{display:block}
/* hero */
#hero{margin:0 -14px;padding:0 14px;overflow-x:clip}  /* аура не создаёт горизонтальный скролл */
.mark{position:relative;width:min(100%,360px);aspect-ratio:1;margin:0 auto 6px;user-select:none;-webkit-user-select:none}
.mark img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.mark canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#aura{inset:-10%;width:120%;height:120%}  /* аура выходит за края логотипа */
/* glass */
.card{background:var(--g);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lb{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;margin:0 0 8px;font-size:14px}
.lb small{color:var(--mu);font-size:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--mu);font:500 13px Manrope;padding:10px 4px;border-radius:999px}
.seg button.on{background:var(--btn);color:#0d1f12;font-weight:700}
.pill{width:100%;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:999px;color:var(--tx);font:400 15px Manrope;padding:9px 14px 9px 10px;margin-bottom:12px;text-align:left}
.pi{width:34px;height:34px;border-radius:50%;background:rgba(166,217,143,.12);display:grid;place-items:center;color:var(--ac);flex:none}
.pv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc{color:var(--mu)}
textarea,.search{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:18px;color:var(--tx);font:400 15px/1.45 Manrope;padding:11px 14px;outline:none}
textarea{min-height:92px;resize:vertical}.search{border-radius:999px;margin-bottom:10px}
textarea:focus,.search:focus{border-color:var(--ac)}
.fl{margin-bottom:12px}
.go{width:100%;border:0;border-radius:999px;background:var(--btn);color:#0d1f12;font:700 17px Manrope;padding:15px;display:flex;gap:8px;justify-content:center;align-items:center;box-shadow:0 6px 24px rgba(140,200,110,.25)}
.go:disabled{opacity:.4;box-shadow:none}
.err{color:#ff9a9a;font-size:12px;min-height:1em;margin:0 0 8px}
/* ref */
.drop{display:block;border:1.5px dashed rgba(166,217,143,.4);border-radius:20px;padding:20px 12px;text-align:center;color:var(--mu);cursor:pointer}
.drop.over{background:rgba(166,217,143,.1)}.drop b{display:block;color:var(--tx);margin:6px 0 2px}.drop input{display:none}.drop svg{margin:auto;color:var(--ac)}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.fm{font-size:12px;color:var(--mu)}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .2s}
audio{width:100%;height:36px}input[type=range]{width:100%;accent-color:var(--ac)}
/* rows */
.row{display:flex;align-items:center;gap:12px;background:var(--g);border:1px solid var(--ln);border-radius:22px;padding:10px;margin-bottom:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.th{width:52px;height:52px;border-radius:12px;flex:none;object-fit:cover;background:linear-gradient(135deg,#6e9a63,#18301f)}
.ri{flex:1;min-width:0}.ri b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ri span{font-size:12px;color:var(--mu)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:rgba(0,0,0,.28);color:var(--tx);display:grid;place-items:center;flex:none;text-decoration:none}
.ib.pl{width:44px;height:44px}.ib.fv.on{color:#ff8fa3}.ib:disabled{opacity:.35}
.empty{color:var(--mu);text-align:center;padding:40px 0}
h2{font:400 26px Jost;margin:6px 0 14px}
/* busy */
.busy{text-align:center}.busy h2{margin:4px 0}.busy p{color:var(--mu);margin:0 0 8px}.tm{font:300 30px Jost;letter-spacing:.1em;color:var(--ac)}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);
background:rgba(10,20,14,.82);border:1px solid var(--ln);border-radius:28px;padding:8px 4px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20}
nav button{border:0;background:none;color:var(--mu);font:400 11px Manrope;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;position:relative}
nav button.on{color:var(--ac)}nav button.on::after{content:"";position:absolute;bottom:-4px;width:26px;height:2px;border-radius:2px;background:var(--ac)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;visibility:hidden}#sheet.open{visibility:visible}
#sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:.2s}#sheet.open #sh-bg{opacity:1}
#sh-box{position:absolute;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:rgba(12,22,16,.97);border:1px solid var(--ln);border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:.25s}
#sheet.open #sh-box{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sh-h b{font-size:17px;font-weight:500}
.sh-h button{border:0;background:var(--btn);color:#0d1f12;font:700 13px Manrope;padding:8px 16px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:rgba(0,0,0,.28);color:var(--tx);font:400 14px Manrope;padding:9px 14px;border-radius:999px}
.chip.on{border-color:var(--ac);color:var(--ac);background:rgba(166,217,143,.12)}
.av{width:72px;height:72px;border-radius:50%;background:var(--btn);color:#0d1f12;display:grid;place-items:center;font:500 30px Jost;margin:0 auto 10px;object-fit:cover}
.st{display:flex;gap:10px;margin-top:14px}.st div{flex:1;text-align:center;padding:12px;border:1px solid var(--ln);border-radius:18px}.st b{display:block;font:400 24px Jost;color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
</style>
</head>

async function downloadFile(url, filename){
  tg?.HapticFeedback?.impactOccurred?.("light");
  try{
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(objUrl), 30000);
  }catch(e){
    // Fallback: системный браузер / новая вкладка
    if(tg?.openLink) tg.openLink(url); else window.open(url, "_blank");
  }
}

/* аудиореференс */
const sz=b=>b>1048576?(b/1048576).toFixed(1)+" МБ":Math.round(b/1024)+" КБ";
function upload(file,prog){return new Promise((res,rej)=>{
  if(!API_BASE){let p=0;const t=setInterval(()=>{p+=20;prog(p);if(p>=100){clearInterval(t);res("demo://"+file.name)}},200);return}
  const x=new XMLHttpRequest(),fd=new FormData();fd.append("file",file);x.open("POST",API_BASE+"/upload");x.setRequestHeader("X-Init-Data",tg?.initData||"");
  x.upload.onprogress=e=>e.lengthComputable&&prog(e.loaded/e.total*100);
  x.onload=()=>{try{x.status<300?res(JSON.parse(x.responseText).uploadUrl):rej(new Error("Ошибка загрузки "+x.status))}catch(e){rej(new Error("Неверный ответ сервера"))}};
  x.onerror=()=>rej(new Error("Сеть недоступна"));x.send(fd)})}
function clearRef(){S.ref=null;$("fileIn").value="";$("fplay").removeAttribute("src");$("fileCard").classList.add("hide");$("drop").classList.remove("hide");validate()}
async function pick(f){
  $("err").textContent="";if(!f)return;
  if(!/\.mp3$/i.test(f.name)&&!/audio\//.test(f.type))return $("err").textContent="Нужен аудиофайл (mp3)";
  if(f.size>MAX_MB*1048576)return $("err").textContent="Файл больше "+MAX_MB+" МБ";
  S.ref={url:null};$("drop").classList.add("hide");$("fileCard").classList.remove("hide");
  $("fname").textContent=f.name;$("fmeta").textContent=sz(f.size)+" · загрузка…";$("fplay").src=URL.createObjectURL(f);$("fbar").style.width="0";validate();
  try{const u=await upload(f,p=>$("fbar").style.width=p+"%");S.ref.url=u;$("fmeta").textContent=sz(f.size)+" · загружен";hap("success")}
  catch(e){clearRef();$("err").textContent=e.message;hap("error")}
  validate();
}
$("fileIn").onchange=e=>pick(e.target.files[0]);$("fdel").onclick=clearRef;

}

  p.genres.forEach(g=>{const d=GENRES.find(x=>x[0]===g);if(d&&d[2])out.push(d[2])});
  p.mood.forEach(m=>{const d=MOODS.find(x=>x[0]===m);if(d&&d[2])out.push(d[2])});
  p.instruments.forEach(i=>{const d=INSTR.find(x=>x[0]===i);if(d&&d[2])out.push(d[2])});
  out.push(VOCAL_DESC[p.vocal]||VOCAL_DESC.instrumental);
  return out.join(", ");
}
const hd=()=>({"Content-Type":"application/json","X-Init-Data":tg?.initData||""});
async function api(path,opt){const r=await fetch(API_BASE+path,opt);if(!r.ok)throw new Error("Сервер вернул "+r.status);return r.json()}
const start=p=>API_BASE?api("/generate",{method:"POST",headers:hd(),body:JSON.stringify(p)}):Promise.resolve({taskId:"demo"});
const status=(id,n)=>API_BASE?api("/status?taskId="+encodeURIComponent(id),{headers:hd()}):Promise.resolve(n>=2?{status:"success",tracks:[{title:"Mountain Flow (демо)"}]}:{status:"pending"});

let tick;
async function submit(){
  if(!validate())return;$("err").textContent="";
  const a=S.mode==="audio";
    const p={mode:S.mode,genres:S.genres,mood:S.mood,instruments:S.instr,duration:S.dur[0],vocal:S.vocal,
    style:buildStyle({genres:S.genres,mood:S.mood,instruments:S.instr,vocal:S.vocal}),
    lyrics:S.mode==="custom"?$("lyrics").value.trim():"",prompt:$("prompt").value.trim(),
    refUrl:a?S.ref.url:null,refWeight:a?$("weight").value/100:null};
  view("busy");const t0=Date.now();$("tm").textContent="00:00";
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},500);
  try{
    const {taskId}=await start(p);
    for(let n=0;n<POLL_MAX;n++){
      await new Promise(r=>setTimeout(r,API_BASE?POLL_MS:3000));
      const s=await status(taskId,n);
      if(s.status==="success"){clearInterval(tick);return finish(s.tracks||[],p)}
      if(s.status==="failed")throw new Error("Генерация не удалась");
    }
    throw new Error("Генерация занимает дольше обычного — трек придёт в чат.");
  }catch(e){clearInterval(tick);view("home");$("err").textContent=e.message||"Что-то пошло не так";hap("error")}
}
function finish(tracks,p){
  const g=p.genres.map(v=>lab(GENRES,v)).join(", ");
  const items=tracks.map((t,i)=>({id:Date.now()+i,title:t.title,audioUrl:t.audioUrl||null,imageUrl:t.imageUrl||null,genre:g,ts:Date.now(),fav:false}));
  save([...items,...load()]);view("done");fill($("doneList"),items,"");hap("success");
}
$("go").onclick=submit;$("again").onclick=()=>view("home");

/* ---- анимация логотипа Alka: звуковые волны + аура ----
   Координаты — в сетке 640×640 (размер логотипа). Статичные столбцы стёрты с картинки и рисуются здесь.
   Слои (снизу вверх): #aura (свечение за логотипом) → #logo → #bars (струящийся свет, столбцы, искры). */
let isBusy=false;
(()=>{
  // столбцы «растут» от ленты: [x, верх при полной высоте, y основания]
  const LB=[[50.7, 297.5, 339.6], [57.9, 291.9, 337.5], [65.0, 282.2, 335.4], [72.6, 271.5, 332.7], [80.6, 260.3, 329.3], [89.1, 245.5, 325.7], [98.2, 220.0, 321.7], [106.5, 238.3, 318.2], [114.8, 253.1, 314.6], [123.7, 267.4, 311.5], [131.6, 279.7, 309.8], [138.9, 288.4, 307.9], [146.0, 297.0, 305.8]], RB=[[484.9, 296.5, 354.7], [491.6, 287.3, 353.9], [498.4, 277.6, 353.2], [506.0, 264.9, 352.4], [513.7, 249.6, 348.4], [522.4, 237.3, 343.0], [532.1, 218.9, 335.3], [540.2, 237.8, 328.2], [548.0, 251.1, 322.5], [554.9, 261.3, 317.7], [562.5, 272.0, 309.5], [569.6, 282.7, 301.7], [576.8, 291.4, 293.4]];
  const PB=[[231.3, 3.5], [238.6, 8.8], [245.8, 15.2], [253.7, 24.9], [261.4, 15.2], [269.0, 8.8], [276.0, 3.5]], PCY=225.2;                 // волна в наушнике: [x, полувысота], центр по y
  const CX=320, CY=312, MARG=64, AW=640+2*MARG;  // центр «пузыря», поля холста ауры
  const cvF=$("bars"), cx=cvF.getContext("2d"), cvA=$("aura"), ca=cvA.getContext("2d"), GL=$("glow"), hero=$("hero");
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let k=1, kA=1, ph=0, e=0, last=0, wasHidden=false;

  function fit(){
    const d=Math.min(devicePixelRatio||1,2);
    let r=cvF.getBoundingClientRect(); cvF.width=Math.max(1,Math.round(r.width*d)); cvF.height=cvF.width; k=cvF.width/640;
    r=cvA.getBoundingClientRect();     cvA.width=Math.max(1,Math.round(r.width*d)); cvA.height=cvA.width; kA=cvA.width/AW;
  }
  // мягкие светящиеся «точки» (спрайты) для частиц и бликов
  const spr=c=>{const s=document.createElement("canvas");s.width=s.height=48;const g=s.getContext("2d"),r=g.createRadialGradient(24,24,0,24,24,24);
    r.addColorStop(0,`rgba(${c},1)`);r.addColorStop(.25,`rgba(${c},.55)`);r.addColorStop(1,`rgba(${c},0)`);g.fillStyle=r;g.fillRect(0,0,48,48);return s};
  const SG=spr("255,214,150"), SB=spr("150,200,255"), ST=spr("130,235,225");
  const rnd=(s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296)(11);
  const PT=[...Array(44)].map(()=>({a:rnd()*6.283,dr:26+rnd()*60,sp:.045+rnd()*.08,ph:rnd(),sz:4+rnd()*9,g:rnd()<.6,wob:rnd()*6.283}));
  const GLINT=[[320.5,22,15,0],[320.5,602,15,2.1],[336,298,13,4.2],[188,388,12,1.3],[402,112,10,3.3],[122,186,10,5.1],[452,322,9,2.7]];

  // уровень столбца 0..1: сумма трёх синусов + общий «бит»; e — энергия (0 покой, 1 генерация/воспроизведение)
  const lvl=(i,t)=>{
    const v=.5+.5*(.55*Math.sin(t*(1.1+.37*(i%5))+i*1.7)+.3*Math.sin(t*(2.3+.21*(i%7))+i*.9+1.3)+.15*Math.sin(t*4.1+i*2.4));
    const beat=.5+.5*Math.sin(t*5.2), lo=.62-.34*e;
    return lo+(1-lo)*Math.min(1,v*(.82+.18*beat*e+.18*(1-e)));
  };

  /* ===== аура за логотипом ===== */
  function drawAura(t){
    ca.setTransform(1,0,0,1,0,0);ca.clearRect(0,0,cvA.width,cvA.height);
    ca.setTransform(kA,0,0,kA,MARG*kA,MARG*kA);ca.globalCompositeOperation="lighter";
    const br=.5+.5*Math.sin(t*.9), beat=.5+.5*Math.sin(t*5.2);
    const a=.15+.10*br+.30*e*(.7+.3*beat);
    const g=ca.createRadialGradient(CX,CY,150,CX,CY,400);                       // дышащее сияние
    g.addColorStop(0,"rgba(90,150,255,0)");g.addColorStop(.42,`rgba(90,150,255,${a*.9})`);
    g.addColorStop(.6,`rgba(255,196,130,${a*.55})`);g.addColorStop(1,"rgba(255,196,130,0)");
    ca.fillStyle=g;ca.fillRect(-MARG,-MARG,AW,AW);
    // три световых пятна кружат вокруг девушки
    [[SG,.33,0,100],[SB,-.27,2.1,120],[ST,.19,4.2,95]].forEach(([s,w,o,R],j)=>{
      const an=t*w+o, x=CX+292*Math.cos(an), y=CY+248*Math.sin(an);
      ca.globalAlpha=Math.min(1,.16+.12*br+.28*e);ca.drawImage(s,x-R,y-R,2*R,2*R);
    });
    // частицы-искры, улетающие от контура
    PT.forEach(p=>{
      const u=(t*p.sp*(1+1.4*e)+p.ph)%1, an=p.a+.18*Math.sin(t*.5+p.wob);
      const x=CX+(296+p.dr*u)*Math.cos(an), y=CY+(250+p.dr*u*.9)*Math.sin(an), s=p.sz*(1+.6*e);
      ca.globalAlpha=Math.pow(Math.sin(Math.PI*u),1.4)*(.45+.5*e);ca.drawImage(p.g?SG:SB,x-s,y-s,2*s,2*s);
    });
    ca.globalAlpha=1;ca.globalCompositeOperation="source-over";
  }

  /* ===== струящийся свет по лентам: слой светящихся нитей, сдвигаемый волной ===== */
  function drawFlow(t){
    if(!(GL.complete&&GL.naturalWidth))return;
    const A0=2.4+3.6*e, N=80, w=640/N;
    cx.globalCompositeOperation="lighter";
    for(let pass=0;pass<2;pass++){
      const tt=t*(pass?.8:1)+pass*2.1;
      for(let i=0;i<N;i++){
        const sx=i*w, xm=sx+w/2;
        const dy=A0*(.6*Math.sin(xm*.019-tt*1.55)+.4*Math.sin(xm*.043+tt*1.05+pass));
        const pulse=.5+.5*Math.sin(xm*.012-tt*1.1+pass*1.7);                      // бегущая волна яркости
        cx.globalAlpha=Math.min(1,(pass?.2:.36)*(.55+.45*pulse)*(1+1.1*e));
        cx.drawImage(GL,sx,0,w,640,sx,dy,w,640);
      }
    }
    cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
  }
  function line(x,y0,y1,c,w){cx.strokeStyle=c;cx.lineWidth=w;cx.lineCap="round";cx.beginPath();cx.moveTo(x,y0);cx.lineTo(x,y1);cx.stroke()}
  function eq(list,t,off){
    list.forEach(([x,top,base],i)=>{
      const h=(base-top)*1.03*lvl(i+off,t), y0=base-h, y1=base+1.5;
      cx.globalCompositeOperation="lighter";
      line(x,y0,y1,"rgba(255,200,130,.13)",8);                                    // свечение
      cx.globalCompositeOperation="source-over";
      line(x,y0,y1,"rgba(255,170,92,.5)",4.6);                                    // тёплая кромка
      const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,"rgba(255,252,242,1)");g.addColorStop(1,"rgba(243,208,150,.72)");
      line(x,y0,y1,g,2.7);                                                         // белое ядро
      cx.globalCompositeOperation="lighter";cx.globalAlpha=.35+.35*e;cx.drawImage(SG,x-6,y0-6,12,12);cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
    });
  }
  function glint(t){
    cx.globalCompositeOperation="lighter";
    GLINT.forEach(([x,y,r,o],j)=>{
      const s=Math.max(0,Math.sin(t*(1.1+.2*j)+o)); const v=s*s*s*(.7+.3*e); if(v<.02)return;
      cx.save();cx.translate(x,y);cx.globalAlpha=v;cx.drawImage(SG,-r,-r,2*r,2*r);cx.fillStyle="#fff6e4";
      const L=r*(.6+.9*s);
      cx.beginPath();cx.moveTo(-L,0);cx.quadraticCurveTo(0,-L*.07,L,0);cx.quadraticCurveTo(0,L*.07,-L,0);cx.fill();
      cx.beginPath();cx.moveTo(0,-L);cx.quadraticCurveTo(L*.07,0,0,L);cx.quadraticCurveTo(-L*.07,0,0,-L);cx.fill();
      cx.restore();
    });
    cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
  }
  function draw(t){
    drawAura(t);
    cx.setTransform(1,0,0,1,0,0);cx.globalCompositeOperation="source-over";cx.clearRect(0,0,cvF.width,cvF.height);cx.setTransform(k,0,0,k,0,0);
    drawFlow(t);
    eq(LB,t,0);eq(RB,t+1.7,3);
    // волна в наушнике: симметричная, с оранжевой кромкой
    cx.globalCompositeOperation="lighter";
    const hg=cx.createRadialGradient(253.7,PCY,0,253.7,PCY,34);hg.addColorStop(0,`rgba(255,170,80,${.1+.22*e})`);hg.addColorStop(1,"rgba(255,170,80,0)");
    cx.fillStyle=hg;cx.fillRect(210,PCY-40,90,80);cx.globalCompositeOperation="source-over";
    PB.forEach(([x,p],i)=>{
      const h=Math.max(2.4,p*lvl(i+7,t*1.15));
      cx.globalCompositeOperation="lighter";line(x,PCY-h,PCY+h,"rgba(255,200,130,.16)",9);cx.globalCompositeOperation="source-over";
      line(x,PCY-h,PCY+h,"rgba(255,150,60,.78)",5.4);line(x,PCY-h,PCY+h,"#fffaf0",3.2);
    });
    glint(t);
  }
  function frame(ts){
    requestAnimationFrame(frame);
    if(document.hidden||hero.classList.contains("hide")){wasHidden=true;return}   // не рисуем, когда логотипа не видно
    if(wasHidden){wasHidden=false;fit();last=ts}
    const dt=Math.min(.1,(ts-last)/1000); if(dt<.022)return; last=ts;
    const target=(isBusy||!A.paused)?1:0; e+=(target-e)*Math.min(1,dt*3);
    ph+=dt*(.9+2.6*e); draw(ph);
  }
  fit(); addEventListener("resize",()=>{fit();if(still)draw(1.3)});
  if(still){e=0;(GL.complete?Promise.resolve():new Promise(r=>GL.onload=r)).then(()=>draw(1.3));}
  else requestAnimationFrame(ts=>{last=ts;frame(ts)});
})();
pills();view("home");
</script>
